<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>

    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>My Library</h1>
        <dialog id="book-info-dialog" popover>
            <form action="" name="book-info-form">
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div>
                    <label for="pages">Number of pages</label>
                    <input type="number" id="pages" name="pages" required>
                </div>
                <div>
                    <input type="checkbox" id="read" name="read">
                    <label for="read">I have read this book</label>
                </div>
                <button type="submit" id="add-book">Add book</button>
                <button type="button" popovertarget="book-info-dialog" popovertargetaction="hide">Cancel</button>
            </form>
        </dialog>

        <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Pages</th>
                        <th>Status</th>
                        <th>*</th>
                    </tr>
                </thead>
                <tbody id="books-display">
                </tbody>
            </table>
        <button popovertarget="book-info-dialog">Add book</button>
    </div>
</body>
</html>
